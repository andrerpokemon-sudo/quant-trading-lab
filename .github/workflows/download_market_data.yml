name: Download 5-minute market data

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install dukascopy-python pandas
      - name: Download 2025 prices
        run: |
          python dukascopy_downloader.py --symbols NAS100 US500 GER40 --timeframe m5 --start 2025-01-01 --end 2026-01-01
      - name: Upload CSV results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-2025
          path: data/*.csv
          if-no-files-found: warn
