name: Download 5-minute market data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download NAS100, US500 and GER40
        run: |
          python dukascopy_downloader.py --symbols NAS100 US500 GER40 --timeframe m5 --start 2026-01-01 --end 2026-10-01
      - name: Upload CSV files as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-data-2026
          path: data/**/*.csv
          if-no-files-found: error
          retention-days: 7
